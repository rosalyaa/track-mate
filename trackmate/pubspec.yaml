  sdk: '>=3.4.4 <4.0.0'


dependencies:
  cloud_firestore: ^5.0.1
  firebase_auth: ^5.1.0
  firebase_core: ^3.1.0
  firebase_storage: ^12.0.1
  flutter:
    sdk: flutter

  flutter_spinkit: ^5.1.0
  get_it: ^7.6.7
